  <circle cx="150" cy="115" r="52" fill="#18181b" />
  <!-- Face -->
  <circle cx="150" cy="118" r="46" fill="#fed7aa" />
  <!-- Hair bangs -->
  <path d="M104 110 Q140 85 196 110 Q150 95 104 110 Z" fill="#18181b" />
  <!-- Eyes -->
  <circle cx="134" cy="118" r="4" fill="#0f172a" />
  <circle cx="166" cy="118" r="4" fill="#0f172a" />
  <!-- Smile -->
  <path d="M140 130 Q150 140 160 130" stroke="#b91c1c" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Doctor Coat -->
  <path d="M70 270 L95 175 Q150 185 205 175 L230 270 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <!-- Inner shirt (Yellow/Orange) -->
