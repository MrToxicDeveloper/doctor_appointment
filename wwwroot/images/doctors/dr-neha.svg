  <!-- Stethoscope (Green) -->
  <path d="M125 180 C125 225, 175 225, 175 180" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" />
  <path d="M150 213 L150 235" stroke="#16a34a" stroke-width="4" />
  <circle cx="150" cy="240" r="8" fill="#86efac" stroke="#15803d" stroke-width="2" />
  <!-- Lapels -->
  <polygon points="95,175 130,175 135,240 115,220" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <polygon points="205,175 170,175 165,240 185,220" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
</svg>