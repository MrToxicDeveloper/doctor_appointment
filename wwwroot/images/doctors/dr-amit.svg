  <rect x="155" y="105" width="25" height="18" rx="4" fill="none" stroke="#334155" stroke-width="3"/>
  <line x1="145" y1="114" x2="155" y2="114" stroke="#334155" stroke-width="3"/>
  <line x1="110" y1="112" x2="120" y2="112" stroke="#334155" stroke-width="3"/>
  <line x1="180" y1="112" x2="190" y2="112" stroke="#334155" stroke-width="3"/>
  <!-- Eyes inside glasses -->
  <circle cx="132" cy="114" r="3.5" fill="#0f172a" />
  <circle cx="167" cy="114" r="3.5" fill="#0f172a" />
