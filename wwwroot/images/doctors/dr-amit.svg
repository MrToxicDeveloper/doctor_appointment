  <polygon points="146,180 154,180 158,210 150,230 142,210" fill="#1e3a8a" />
  <!-- Stethoscope (Blue) -->
  <path d="M125 180 C125 220, 175 220, 175 180" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" />
  <path d="M150 207 L150 230" stroke="#2563eb" stroke-width="4" />
  <circle cx="150" cy="235" r="8" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2" />
  <!-- Lapels -->
  <polygon points="95,175 135,175 140,240 115,220" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <polygon points="205,175 165,175 160,240 185,220" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
</svg>