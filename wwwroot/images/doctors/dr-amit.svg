  <path d="M140 132 Q150 140 160 132" stroke="#92400e" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Doctor Coat -->
  <path d="M70 270 L95 175 Q150 185 205 175 L230 270 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
