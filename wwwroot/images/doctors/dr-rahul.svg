<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" fill="#e0f2fe" rx="16"/>
  <!-- Doctor avatar with stethoscope and coat -->
  <circle cx="150" cy="110" r="50" fill="#fcd34d" />
  <!-- Hair -->
  <path d="M100 100 Q150 55 200 100 Q195 70 150 65 Q105 70 100 100 Z" fill="#1e293b" />
  <!-- Face details -->
  <circle cx="135" cy="110" r="4" fill="#0f172a" />
  <circle cx="165" cy="110" r="4" fill="#0f172a" />
  <path d="M142 125 Q150 133 158 125" stroke="#b45309" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Doctor Coat -->
  <path d="M70 270 L95 175 Q150 185 205 175 L230 270 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <!-- Shirt & Tie -->
  <polygon points="135,175 165,175 155,225 145,225" fill="#0284c7" />
  <polygon points="146,180 154,180 158,210 150,230 142,210" fill="#0369a1" />
  <!-- Lapels -->
  <polygon points="95,175 135,175 140,240 115,220" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <polygon points="205,175 165,175 160,240 185,220" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Stethoscope -->
  <path d="M125 180 C125 220, 175 220, 175 180" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" />
  <path d="M150 207 L150 230" stroke="#475569" stroke-width="4" />
  <circle cx="150" cy="235" r="8" fill="#94a3b8" stroke="#475569" stroke-width="2" />
  <!-- Badge -->
  <rect x="180" y="210" width="18" height="25" rx="3" fill="#0ea5e9" opacity="0.9"/>
  <rect x="183" y="214" width="12" height="3" fill="#ffffff"/>
  <rect x="183" y="219" width="8" height="2" fill="#ffffff"/>
</svg>